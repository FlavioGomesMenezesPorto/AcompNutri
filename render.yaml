# Render Blueprint do AcompNutri — cria a API e o site de uma vez:
#   Render → New → Blueprint → escolha este repositório.
#
#   acompnutri-api  API (pasta server/)
#   acompnutri      Site (Vite → arquivos estáticos)
#
# O banco fica no Neon (Postgres grátis que não expira): crie em https://neon.tech
# e cole a connection string em DATABASE_URL.
#
# Os campos marcados "sync: false" o Render pede na criação (veja o README, seção Render).

services:
  - type: web
    name: acompnutri-api
    runtime: node
    plan: free            # dorme após 15 min sem uso; a primeira chamada leva ~1 min
    region: virginia      # mais perto do Brasil entre as opções do Render (use o Neon em US East também)
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: America/Sao_Paulo
      - key: DATABASE_URL              # connection string do Neon (postgresql://...neon.tech/...)
        sync: false
      - key: DATABASE_SSL              # o Neon exige SSL
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: SUPABASE_URL              # Project URL do Supabase novo
        sync: false
      - key: CORS_ORIGIN               # https://acompnutri.onrender.com,https://localhost
        sync: false

  - type: web
    name: acompnutri
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_SUPABASE_URL         # Project URL do Supabase novo
        sync: false
      - key: VITE_SUPABASE_KEY         # chave publishable/anon do Supabase novo
        sync: false
      - key: VITE_API_URL              # https://acompnutri-api.onrender.com
        sync: false
